[package]
name = "mantis-hybrid"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
tokio-util = "0.7"
futures-util = "0.3"
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "native-tls"] }
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

# Crypto — HMAC handshake + HKDF key derivation + AES-256-GCM payload encryption
aes-gcm = "0.10"
hmac = "0.12"
sha2 = { version = "0.10", features = ["oid"] }
hkdf = "0.12"

# Kalshi WS auth — RSA-PSS signature on HTTP upgrade handshake
rsa = "0.9"
base64 = "0.22"

[dev-dependencies]
libm = "0.2"
